name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  browser:
    # Clicks through the app in Chromium with JavaScript off and on, against a copy of web/ served on
    # the runner, so the help links and the form are checked the way a phone sees them.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Installed at the repo root and not saved anywhere, so the script under .github/scripts resolves it.
      - name: Install Playwright and Chromium
        id: playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Serve web/ and run the browser checks
        env:
          SITE_URL: http://localhost:8000/
        run: |
          python3 -m http.server 8000 --directory web &
          node .github/scripts/browser-check.mjs

      # Photographs this branch's own web/ in both themes, so a change to the look can be reviewed from
      # the run's summary page without a local browser. Runs even when a check above fails.
      - name: Photograph every screen
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        env:
          SITE_URL: http://localhost:8001/
          OUT_DIR: screenshots
          ALL_STATES: "1"
        run: |
          python3 -m http.server 8001 --directory web &
          curl -sf --retry 20 --retry-delay 1 --retry-connrefused -o /dev/null "$SITE_URL"
          node .github/scripts/screenshots.mjs

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn

  compute:
    # Cheap checks only, with no model download or training. smoke.yml runs the real pipeline on a
    # tiny CPU model when compute/ changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile every script
        run: python -m py_compile compute/*.py compute/therapistgpt/*.py
      - name: Validate seed data against the schema
        run: python compute/validate_data.py compute/data/seed.jsonl
      - name: Unit tests
        working-directory: compute
        run: python -m unittest discover -s tests
